<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Ornstein</title>
  <link rel="stylesheet" href="styles.css?v=13">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Views render into here; the router (app.js) picks one from ?view= -->
  <div id="view-root"></div>

  <!-- ===================== PORTFOLIO VIEW (template) ===================== -->
  <template id="tmpl-portfolio">
  <nav id="nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo">DO</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#value">What I Bring</a></li>
        <li><a href="#career">Career</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#patents">Patents</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="view-switcher" data-switcher></div>
    </div>
  </nav>

  <header id="hero">
    <div class="hero-grid container">
      <div class="hero-content">
        <p class="hero-greeting">Hello, I'm</p>
        <h1 class="hero-name">David Ornstein</h1>
        <p class="hero-tagline" id="heroTagline"></p>
        <div class="hero-cta">
          <a href="#about" class="btn btn-primary" style="background:#ea580c;border-color:#ea580c;">Learn More</a>
          <a href="#contact" class="btn btn-outline">Get in Touch</a>
        </div>
      </div>
      <aside class="hero-testimonials" aria-label="What others say">
        <div class="hero-testimonials-header">
          <h2 class="hero-testimonials-heading">What Others Say</h2>
          <div class="hero-quote-nav-group">
            <button type="button" class="hero-quote-nav hero-quote-prev" aria-label="Previous quote">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button type="button" class="hero-quote-nav hero-quote-next" aria-label="Next quote">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
        <div class="hero-quote-stack" aria-live="polite">
          <!-- Populated at runtime from the rendered #testimonials carousel -->
        </div>
        <div class="hero-quote-footer-row">
          <div class="hero-quote-dots" role="tablist" aria-label="Featured quotes"></div>
        </div>
      </aside>
    </div>
  </header>

  <section id="about" class="section">
    <div class="container">
      <h2 class="section-title">About Me</h2>
      <div class="about-grid">
        <div class="about-text" id="aboutText"><!-- basics.summary --></div>
        <aside class="about-side">
        <figure class="about-portrait">
          <img src="media/david-ornstein.webp" alt="Portrait of David Ornstein" width="1065" height="1332" loading="lazy">
        </figure>
        <div class="about-stats" id="aboutStats"><!-- basics.stats --></div>
        </aside>
      </div>
    </div>
  </section>

  <!-- ===== What I Bring — Value Proposition ===== -->
  <section id="value" class="section value-section">
    <div class="container">
      <h2 class="section-title">What I Bring</h2>
      <p class="section-subtitle">The intersection of deep technical skill, executive-level leadership, a builder&rsquo;s instinct, and a proven ability to work natively with AI.</p>

      <div class="value-grid" id="valueGrid"><!-- valueProps --></div>

      <div class="value-cta">
        <p class="value-cta-text" id="valueCtaText"><!-- valuePropsCta --></p>
        <a href="#contact" class="btn btn-primary">Let's Talk</a>
      </div>
    </div>
  </section>

  <section id="career" class="section section-alt">
    <div class="container">
      <h2 class="section-title">Career</h2>
      <p class="section-subtitle" id="careerSubtitle"><!-- timeline.subtitle --></p>

      <!-- Filter bar -->
      <div class="filter-bar" id="filterBar">
        <div class="filter-bar-inner">
          <div class="filter-bar-header">
            <span class="filter-label">Filter by skill:</span>
            <button class="filter-clear" id="filterClearBtn" type="button" hidden>Clear</button>
            <div class="filter-count" id="filterCount">
              <span class="filter-count-num" id="filterCountNum">21</span>
              <span class="filter-count-label">roles shown</span>
            </div>
          </div>
          <div class="filter-groups" id="filterGroups">
            <!-- Populated from window.RESUME.skills on load. -->
          </div>
        </div>
      </div>

      <!-- Filter summary (populated by JS) -->
      <div class="filter-summary" id="filterSummary"></div>

      <div class="timeline" id="careerTimeline"><!-- timeline.eras + work[] --></div>
    </div>
  </section>

  <!-- ===== Endorsements (data source for the hero rotator; not displayed) ===== -->
  <section id="testimonials" class="testimonials-section" hidden aria-hidden="true">
    <div class="container">
      <h2 class="section-title">What Others Say</h2>
      <p class="section-subtitle">From colleagues, executives, and partners across Microsoft.</p>

      <div class="testimonial-carousel">
        <button class="carousel-btn carousel-prev" aria-label="Previous testimonial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>

        <div class="carousel-viewport">
          <div class="carousel-track" id="testimonialTrack"><!-- references --></div>
        </div>

        <button class="carousel-btn carousel-next" aria-label="Next testimonial">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <div class="carousel-dots" aria-label="Testimonial navigation"></div>
        <p class="carousel-counter"><span class="carousel-current">1</span> of <span class="carousel-total">20</span></p>
      </div>
    </div>
  </section>

  <section id="skills" class="section section-alt">
    <div class="container">
      <h2 class="section-title">Skills &amp; Expertise</h2>
      <p class="section-subtitle">The taxonomy behind the work &mdash; also used to filter the timeline above.</p>
      <div id="skillsBody"><!-- skills[] --></div>
    </div>
  </section>

  <section id="patents" class="section">
    <div class="container">
      <h2 class="section-title">Patents &amp; Standards</h2>
      <div class="patents-grid">
        <div class="patent-block">
          <h3>Patents</h3>
          <div id="patentsSummary"><!-- patents.summary --></div>
        </div>
        <div class="patent-block">
          <h3>Standards</h3>
          <ul id="standardsList"><!-- standards[] --></ul>
        </div>
      </div>
    </div>
  </section>

  <section id="interests" class="section section-alt">
    <div class="container">
      <h2 class="section-title">Beyond Work</h2>
      <p class="section-subtitle">The other parts of life that make the work better.</p>
      <div class="interests-grid" id="interestsGrid"><!-- interests[] --></div>
      <p class="interests-note">More personal content coming soon &mdash; stay tuned.</p>
    </div>
  </section>

  <section id="contact" class="section contact-section">
    <div class="container">
      <h2 class="section-title">Let&rsquo;s Connect</h2>
      <p class="section-subtitle">Open to conversations about the right opportunity.</p>

      <div class="contact-grid">
        <div class="contact-frame">
          <h3>How I Can Help</h3>
          <ul class="contact-modes" id="contactModes"><!-- contact.modes --></ul>
        </div>

        <div class="contact-action">
          <div class="contact-action-inner">
            <h3>Get in Touch</h3>
            <p>I&rsquo;m always happy to connect with people who build interesting things.</p>
            <div class="contact-buttons">
              <a href="mailto:davidorn@live.com" class="btn btn-primary contact-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Email Me
              </a>
            </div>
            <div class="contact-resume">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6M9 15l3 3 3-3"/></svg>
              <span>Resume available on request</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; David Ornstein</p>
    </div>
  </footer>
  </template>
  <!-- =================== END PORTFOLIO VIEW (template) =================== -->

  <!-- Glossary flyout -->
  <div id="glossary-overlay" class="glossary-overlay"></div>
  <aside id="glossary-panel" class="glossary-panel" role="dialog" aria-hidden="true">
    <button class="glossary-close" aria-label="Close glossary">&times;</button>
    <div class="glossary-body">
      <span class="glossary-badge">Glossary</span>
      <h3 id="glossary-title" class="glossary-title"></h3>
      <div id="glossary-image" class="glossary-image"></div>
      <div id="glossary-text" class="glossary-text"></div>
      <div id="glossary-links" class="glossary-links"></div>
    </div>
  </aside>

  <script src="vendor/js-yaml.min.js"></script>
  <script src="glossary.js?v=4"></script>
  <script src="script.js?v=12"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
