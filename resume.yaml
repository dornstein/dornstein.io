# ============================================================================
# resume.yaml — presentation-independent source of truth for dornstein.io
# See docs/resume-schema.md for the schema specification.
#
# Facts live here exactly once. The interactive site, the linear résumé, and the
# linkedin-sync skill each render their own VIEW of this data.
#   - Prose (summary/highlights) is PLAIN TEXT; glossary links are the `terms:` list.
#   - Glossary DEFINITIONS (glossary[].html) are the one deliberate HTML exception.
#   - `display:` and top-level `timeline:` are site-only presentation.
#   - startDate/endDate are true machine dates (YYYY-MM); display.dateLabel is the
#     editorial string the site shows (they can differ).
# ============================================================================

meta:
  schemaVersion: "1.0"
  lastModified: "2026-08-25"
  canonical: "https://dornstein.io"
  sources:
    - "REFERENCE.md (factual source of truth)"
    - "index.html (timeline, stats, value props, interests)"
    - "glossary.js (term definitions)"
    - "patents.html (patents + OPC legacy)"

# ----------------------------------------------------------------------------
basics:
  name: David Ornstein
  # Positioning prose in three VIEW-NEUTRAL tiers, distinguished by length, not by view:
  #   label    — short tagline
  #   headline — one-glance positioning statement
  #   summary  — full narrative (below)
  # No tier is owned by a view; each view renders whichever tier fits its format
  # (the portfolio hero uses `label`; the linear résumé uses `headline`). All are
  # equally available to any current or future view.
  # NOTE: `label` and `headline` are newly-authored, David-approved positioning prose
  # (2026-08, candidates "1A"/"2A") — the only non-verbatim copy in the rework. Both
  # lead with the AI-native present rather than the "40+ years" tenure signal.
  # See docs/resume-rework-audit.md.
  label: >-
    Software architect and engineering leader building AI-native platforms —
    most recently Indra, a security platform I run as its sole human architect
    alongside a team of AI agents.
  headline: >-
    Principal architect and engineering leader. I've founded companies, shaped
    industry standards, and secured software at Microsoft scale — and I now build
    AI-native platforms as a single architect working with a team of AI agents.
  image: media/david-ornstein.webp
  email: davidorn@live.com
  url: https://dornstein.io
  location:
    city: Redmond
    region: WA
    countryCode: US
  profiles:
    - { network: GitHub, url: "https://github.com/dornstein" }
    - { network: LinkedIn, url: "https://www.linkedin.com/in/dornstein/" }
  summary:
    - >-
      I've spent my career at the intersection of technology leadership and
      hands-on engineering — building products, founding companies, shaping
      standards, leading teams, and securing the software ecosystem at scale.
    - >-
      Across 25+ years at Microsoft, I've been an architect, a compliance
      director, a Chief of Staff for Trustworthy Computing, and a platform
      founder. I conceived and led Liquid, the internal platform that automated
      security compliance for 8,000+ services company-wide. Before that, I
      architected the "Metro" document format that became the foundation for
      Office 2007 and XPS, built FlexWiki (1,000+ wikis inside Microsoft), and
      led engineering compliance programs managing $10M+ annually under the DOJ
      consent decree.
    - >-
      Before Microsoft, I founded a web-tools startup, helped invent the Rocket
      eBook as CTO of NuvoMedia (acquired for $200M), and served as President of
      the Open eBook Forum. I've been a chief architect, a standards chairman, a
      startup CEO, and an individual contributor — sometimes in the same year.
    - >-
      Most recently I've been building Indra — an AI-first app platform inside
      Microsoft's CISO organization that gives security engineers the building
      blocks to turn their expertise into tools the whole organization can use. I
      lead Indra as its sole human architect, working alongside a team of eight
      specialized AI agents, each owning a distinct domain: engineering,
      strategy, security review, storytelling, advocacy, and more. It's a new
      model for software development — one architect, a crew of AI collaborators,
      and the throughput of a full engineering org — and I'm building the proof
      of it.
    - >-
      I care about building things well, about the craft of software, and about
      helping the people around me grow.
  summaryTerms: [trustworthy-computing, liquid, metro, flexwiki, consent-decree, rocket-ebook, nuvomedia, oebf, indra]
  # Résumé view uses these summary paragraphs in this order (indices into summary[]):
  # lead with Indra (3), then Microsoft (1), then pre-Microsoft founder/CTO (2). Drops
  # the generic opener (0) and the "craft" closer (4). Selection + reorder only — every
  # sentence shown is verbatim from summary[]; no rewriting.
  resumeSummaryOrder: [3, 1, 2]
  # Order is outcome-first, tenure LAST — a presentation insight that applies to
  # every view a hiring audience sees (résumé AND portfolio), not just the résumé.
  # Both views render these in array order, so this list is the single source of
  # that ordering. (Values/labels unchanged; this is a reorder only.)
  stats:
    - { slug: stat-services,  value: "8K+",   label: "Services Secured", resume: true }
    - { slug: stat-exit,      value: "$200M", label: "Startup Exit", resume: true }
    - { slug: stat-patents,   value: "12+",   label: "Patents", resume: true }
    - { slug: stat-engineers, value: "50+",   label: "Engineers Led", resume: true }
    - { slug: stat-companies, value: "3",     label: "Companies Founded", resume: true }
    - { slug: stat-budget,    value: "$250M", label: "Largest Budget Managed" }
    - { slug: stat-lines,     value: "150K+", label: "Lines Shipped (Past 60 Days)" }
    - { slug: stat-years,     value: "40+",   label: "Professional Years", resume: true }

