work:

  - id: indra
    resume: full
    organization: Microsoft
    group: microsoft
    position: Principal Security Architect
    location: Redmond, WA
    startDate: "2026-01"
    endDate: present
    employmentType: full-time
    visibility: [site, resume, linkedin]
    # Short framing note for this role (view-neutral; any view may render it).
    # Newly-authored, David-approved prose (2026-08, candidate "3-B"): frames the
    # Senior Director -> Principal Architect move as a deliberate shift in degree
    # (hands-on part -> whole), not a return from absence. See resume-rework-audit.md.
    context: >-
      I've stayed close to the code and architecture throughout my career,
      including my Senior Director years; moving to principal architect for Indra
      was a deliberate choice to make hands-on system-building the whole job.
    summary: >-
      Conceived and built Indra, an AI-first app platform inside Microsoft's CISO
      organization. Indra solves a fundamental problem: security knowledge across
      dozens of CISO domains is fragmented across dashboards, Kusto queries, and
      engineers' heads — inaccessible to leaders who need a cross-domain view, and
      invisible to AI. Indra gives SIGMA engineers the building blocks to turn
      their security expertise into tools the whole organization can use, and
      gives deputy CISOs a unified view of posture across verticals. Lead Indra as
      its sole human architect, working daily alongside a team of eight
      specialized AI agents built as GitHub Copilot custom agents, each owning a
      distinct domain.
    highlights:
      - >-
        Direct eight specialized AI agents — engineering, security review,
        strategy, and more, built as GitHub Copilot custom agents — through a real
        engineering discipline: every change clears human review, a security-review
        agent, CI tests and static analysis, and version-controlled prompts and
        specs before it merges.
      - >-
        Sole human architect of a ~340,000-line (non-test), 95%-TypeScript
        monorepo — 10 packages, ~69 apps, a 90+-component design system, and ~735
        automated test files — with state, plans, and specs managed in-repo and
        legible to people, not just agents.
      - >-
        In production with real teams building on it: beyond the platform's own
        apps, ~10–15 engineers across 5–6 teams have shipped apps on Indra, and
        CISO leaders use its Unified Security Reporting dashboards across dozens of
        security domains.
      - >-
        Shipped natural-language querying that turns plain-English questions into
        Kusto queries over security data, a cross-domain posture view that replaces
        manual dashboard-by-dashboard reporting, permission-aware Power BI
        embedding, and an app-hosting runtime with CI/CD so security engineers ship
        internal tools without standing up infrastructure.
    skills: [ai-native-software-engineering, ai-harness-engineering, security-architecture, static-code-analysis, cloud-security, secure-development-lifecycle-sdl, complex-systems-architecture, platform-engineering, interoperability, people-development-coaching, technical-strategy, engineering-leadership, cross-functional-team-leadership, protocol-design, c-net, typescript-javascript, sql, net-framework-asp-net, relational-databases, windows, node-js, react, azure-azure-devops]
    terms: [indra, sigma]
    display:
      era: microsoft-security-compliance
      cardTitle: Indra — AI-First Security App Platform
      roleLine: Principal Security Architect & Project Lead · SIGMA (CISO)
      dateLabel: "2026 – Present"
      image: null

