# glossary[] — flyout term definitions. html bodies are HTML (deliberate exception).
glossary:
  - slug: stat-years
    title: 40+ Professional Years in Software
    category: stat
    image: null
    links: []
    html: |
      <p>I wrote my first commercial software in 1979 as one of Sinclair Research’s earliest US employees, before the ZX80 had even launched in the US. What followed is a career that has tracked — and often anticipated — every major platform shift: from 8-bit microcomputers and assembly language through the PC era, object-oriented programming (Smalltalk from the late ‘80s), the web, XML-based document formats, enterprise security, and now AI-native development.</p><p>The 40+ counts paid professional years writing software, leading teams, or founding companies. It spans hardware (bank-switching chip design, ROM porting), firmware (Rocket eBook device software), enterprise software (CASE tools, compliance platforms), consumer products, and modern cloud platforms (Liquid, Indra). Each domain taught a different kind of engineering thinking — and those lessons compound.</p>

  - slug: stat-patents
    title: 12+ Patents
    category: stat
    image: null
    links:
      - { label: "View all patents", url: "patents.html" }
    html: |
      <p>The 12+ patents were filed as primary inventor during my work on the Metro/XPS document format at Microsoft (2001–2004). They cover document formats, digital rights management, and security architecture — areas where novel mechanisms were needed to make the cross-team initiative work. These aren’t defensive filings; they reflect inventions that shipped in Office 2007, Windows, and Microsoft’s Rights Management infrastructure.</p><p>I also hold an earlier patent from Timex Computer Corp. (1982–1983) for a memory bank-switching system for the Timex/Sinclair 2000 — a hardware mechanism to extend the Z80’s severely limited address space. That patent predates the Microsoft work by two decades and sits in a completely different domain, but the pattern is the same: when the existing solution is insufficient, invent a better one.</p>

  - slug: stat-companies
    title: 3 Companies Founded
    category: stat
    image: null
    links: []
    html: |
      <p><strong>Heuristics</strong> (1981–1982) was a technical services company for the Sinclair computing community — the only authorized Sinclair service center in the US. Small but profitable, run while I was still a college student.</p><p><strong>Pragmatica</strong> (1995–1998) was a web-tools startup I founded and led as CEO. We built an object-oriented web programming language with SGML syntax (predating XML), grew to 10 employees plus consultants, and attracted ~5,000 customers before I wound it down to join NuvoMedia.</p><p><strong>NuvoMedia</strong> (1998–2001), where I joined as Director of Software Development and was promoted to CTO, invented the Rocket eBook — one of the world’s first dedicated e-readers, nearly a decade before the Kindle. Acquired by Gemstar in 2000 for $200M.</p>

  - slug: stat-services
    title: 8,000+ Services Secured
    category: stat
    image: null
    links: []
    html: |
      <p>This figure refers to the Microsoft services brought under continuous, automated SDL compliance by the Liquid platform I conceived and led from 2015 to 2025. Before Liquid, security compliance was largely a manual, periodic process: engineering teams self-attested to a checklist, auditors spot-checked, and the overall picture was delayed and incomplete.</p><p>Liquid replaced that model with continuous monitoring: automated policy scanners, code analysis pipelines, and a unified dashboard showing real-time compliance status. The scale — 8,000+ services, 1,200+ repos, ~18,000 services tracked via the Security Bugs S360 KPI — made the shift from attestation to automation not just valuable but necessary. No manual process could track that many moving parts with the fidelity the company needed.</p>

  - slug: stat-exit
    title: $200M Startup Exit
    category: stat
    image: null
    links: []
    html: |
      <p>NuvoMedia, Inc. was acquired by Gemstar International in March 2000 for approximately $200M. The company had invented the Rocket eBook in 1998 — a 22-ounce handheld device that could store roughly 55,000 pages of text, with a backlit screen and DRM-protected content distribution. As CTO, I led the engineering organization through the technical due diligence process, integration planning, and post-close transition.</p><p>The Rocket eBook launched nearly a decade before Amazon’s Kindle (2007), and the architecture we built — secure content distribution, device-based DRM, publisher partnerships — anticipated the e-reader market’s eventual mainstream success. The $200M exit validated that early vision, though the timing (just before the dot-com bust) also illustrated how much market readiness matters alongside technical merit.</p>

  - slug: stat-budget
    title: $250M Largest Budget Managed
    category: stat
    image: null
    links: []
    html: |
      <p>The largest budget I’ve overseen combines the compliance engineering program at Microsoft (over $10M annually in direct operating costs) with the broader security assurance and strategic programs I coordinated as Chief of Staff to the CVP of Trustworthy Computing — a role that touched hundreds of millions in security investment across the company.</p><p>At that scale, budget management is less about tracking spending and more about allocating organizational attention: which programs get investment, which get wound down, which get scaled, and how to make the ROI case to executives. Security compliance programs are unusual because the “return” is measured in risks that don’t materialize — a fundamentally different calculus than typical product investment.</p>

  - slug: stat-lines
    title: 150K+ Lines Shipped in 60 Days
    category: stat
    image: null
    links: []
    html: |
      <p>The Indra platform is a ~150K-line TypeScript codebase — React frontend, Node.js backend, Azure infrastructure-as-code — built almost entirely by me working with a team of eight AI agents. The “past 60 days” figure reflects the pace in the most recent sprint cycle: designing and shipping new platform features, building apps on the platform, writing documentation, and maintaining CI/CD pipelines.</p><p>For context: 150,000 lines of production TypeScript in 60 days averages over 2,500 lines per working day. That is not typing speed. It is AI-accelerated development with an experienced architect directing every piece of it, reviewing every output, and maintaining architectural coherence across the whole system. This is what the AI-native super-IC model makes possible — and Indra is the live proof.</p>

  - slug: stat-engineers
    title: 50+ Engineers Led
    category: stat
    image: null
    links: []
    html: |
      <p>At Microsoft’s Assurance Engineering, I built and led a 20+ person Deep Engineering team responsible for the Liquid compliance platform — software engineers, program managers, and data engineers working across SDL automation and security tooling. As CTO of NuvoMedia, I led a cross-functional engineering organization through the full product lifecycle of the Rocket eBook. At INTERSOLV, I managed a bi-coastal team of 12 as Director of Development for the Excelerator II CASE tool.</p><p>As Chief of Staff to the CVP of Trustworthy Computing at Microsoft, I coordinated security initiatives across engineering teams spanning multiple divisions — an indirect leadership role whose impact extended well beyond direct headcount. The 50+ figure reflects both direct and matrix leadership across these roles.</p>

  - slug: indra
    title: Indra
    category: project
    image: null
    links:
      - { label: "Visit Indra", url: "https://indra.microsoft.com" }
    html: |
      <p>An AI-first app platform inside Microsoft’s CISO organization, conceived and led by David Ornstein as its sole human architect. Indra gives SIGMA security engineers building blocks to turn their expertise — Kusto queries, compliance workflows, operational know-how — into tools the whole organization can use, and gives deputy CISOs a unified view of security posture across domains.</p><p>The platform solves a fundamental fragmentation problem: security knowledge across CISO’s dozens of domains is scattered across dashboards, scripts, and individual engineers’ heads — inaccessible to leaders who need a cross-domain view and invisible to AI. Indra provides unified security reporting dashboards, a natural-language AI agent over security data, Kusto query integration, Power BI embedding, an app hosting ecosystem, and a full CI/CD pipeline.</p><p>What makes Indra distinctive is its development model: David leads a team of eight specialized AI agents — each a GitHub Copilot custom agent with a distinct role (engineer, strategist, security sentinel, narrator, advocate, presenter, editor) — and together they sustain a platform-scale project with the throughput of a full engineering org. It is a working proof of the AI-native super-IC concept.</p>

  - slug: liquid
    title: Liquid Platform
    category: project
    image: null
    links:
      - { label: "What is Liquid? (Microsoft internal)", url: "https://liquid.microsoft.com/Web/Docs/all/WhatIsLiquid.md" }
    html: |
      <p>Microsoft’s internal platform for continuous security assurance and compliance, conceived and led by David starting around 2015. Liquid automated the Security Development Lifecycle (SDL) and other compliance processes that had previously relied on manual attestations and yearly audits.</p><p>The platform includes automated policy scanners, code compliance pipelines, and a unified dashboard for security standards adherence, integrated with Azure DevOps across the company. Liquid became the core of Microsoft’s Continuous SDL program, providing automated coverage for over 8,000 services company-wide and enabling real-time compliance checks.</p><p>David’s manager described Liquid’s impact: “Liquid anchors the company-wide continuous SDL… shifting processes to automated coverage,” acknowledging David’s “incredible impact” on Microsoft’s security engineering ecosystem.</p>

  - slug: sigma
    title: SIGMA (Standards, Insights, Governance, Monitoring & Assurance)
    category: org
    image: null
    links: []
    html: |
      <p>A team within Microsoft’s CISO (Chief Information Security Officer) organization responsible for security standards, compliance monitoring, and assurance across the company. SIGMA integrates the work formerly spread across multiple security governance teams into a unified function.</p><p>David’s Liquid platform and Assurance Engineering efforts were fully integrated into SIGMA by 2021–2023, with David continuing as the team’s leader and technical evangelist. He transitioned to Principal Security Architect within SIGMA in late 2025.</p>

  - slug: sdl
    title: Security Development Lifecycle (SDL)
    category: concept
    image: null
    links:
      - { label: "SDL on Wikipedia", url: "https://en.wikipedia.org/wiki/Security_Development_Lifecycle" }
    html: |
      <p>A software development process created by Microsoft that integrates security practices into every phase of the development lifecycle — from requirements and design through implementation, testing, and release. First formalized by Microsoft in 2004, the SDL became mandatory for all Microsoft products.</p><p>The SDL includes practices like threat modeling, static code analysis, fuzz testing, and security reviews. David’s Liquid platform automated many SDL requirements, shifting the company from periodic manual audits to continuous, data-driven compliance monitoring across 8,000+ services.</p>

  - slug: twc
    title: Trustworthy Computing (TwC)
    category: org
    image: null
    links: []
    html: |
      <p>A central security strategy group at Microsoft, led by Senior VP Scott Charney, focused on improving the trustworthiness of Microsoft’s products and services. TwC coordinated security engineering, security standards, compliance, and privacy programs across the company.</p><p>David served as Chief of Staff for TwC from 2008 to 2014, coordinating cross-team security initiatives and helping shift Microsoft’s approach from compliance checklists to proactive security assurance. In 2014, TwC’s functions were reorganized into Microsoft’s legal and corporate affairs domain (CELA), a transition David helped manage.</p>

  - slug: codeql
    title: CodeQL Central
    category: project
    image: null
    links:
      - { label: "CodeQL on GitHub", url: "https://codeql.github.com/" }
    html: |
      <p>A scalable code analysis service for detecting security vulnerabilities, co-incubated by David’s team at Microsoft. CodeQL uses a query language to treat code as data, enabling sophisticated pattern matching to find bugs, vulnerabilities, and code quality issues across large codebases.</p><p>David’s team helped establish CodeQL Central as a company-wide service, making advanced static analysis available to engineering teams across Microsoft’s thousands of repositories.</p>

  - slug: azure-devops
    title: Azure DevOps
    category: tech
    image: null
    links:
      - { label: "Azure DevOps", url: "https://azure.microsoft.com/en-us/products/devops/" }
    html: |
      <p>Microsoft’s cloud-based platform for software development collaboration, providing version control, CI/CD pipelines, project tracking, and artifact management. Under David’s leadership, the Liquid platform was integrated with Azure DevOps across the company, enabling engineering teams to get real-time compliance checks as part of their standard development workflow.</p>

  - slug: metro
    title: Metro Document Format
    category: project
    image: media/office2007ribbon.png
    imageAlt: "Office 2007 Ribbon interface — built on the Metro/Open XML format David architected"
    links:
      - { label: "Office Open XML on Wikipedia", url: "https://en.wikipedia.org/wiki/Office_Open_XML" }
      - { label: "Open XML Paper Specification", url: "https://en.wikipedia.org/wiki/Open_XML_Paper_Specification" }
    html: |
      <p>The internal code name for a document format initiative David architected at Microsoft that unified how documents were represented in XML. It became two major shipping formats: the Office Open XML file formats (used in Office 2007 and later for .docx, .xlsx, and .pptx files) and the XML Paper Specification (XPS), Windows’ answer to PDF.</p><p>The format was notable for being ZIP-based, fully XML, and designed for both editing and fixed-layout scenarios. It was one of the largest cross-company technical efforts at Microsoft during the early 2000s.</p>

  - slug: flexwiki
    title: FlexWiki
    category: project
    image: null
    links:
      - { label: "FlexWiki on Wikipedia", url: "https://en.wikipedia.org/wiki/FlexWiki" }
    html: |
      <p>A wiki engine David built while at Microsoft, written in C#/.NET. It grew organically to become one of the most widely-used internal collaboration tools at the company, with over 1,000 wiki instances hosted on the internal network at <code>http://wiki</code>.</p><p>FlexWiki was later released as an open-source project and became an influential early example of enterprise wiki software. It demonstrated the power of lightweight, self-service knowledge management years before tools like Confluence became dominant.</p>

  - slug: rocket-ebook
    title: Rocket eBook
    category: project
    image: null
    links:
      - { label: "Rocket eBook on Wikipedia", url: "https://en.wikipedia.org/wiki/Rocket_eBook" }
    html: |
      <p>One of the world’s first dedicated e-reader devices, created by NuvoMedia and launched in 1998. It featured a backlit touchscreen, could hold about ten books, and sold for around $499. The device included a secure content distribution system and supported annotations and bookmarks.</p><p>The Rocket eBook preceded Amazon’s Kindle by nearly a decade and is considered a pioneering milestone in the history of digital reading. It proved the concept of a dedicated reading device, even though the market wouldn’t fully mature for another ten years.</p>

  - slug: nuvomedia
    title: NuvoMedia, Inc.
    category: org
    image: null
    links:
      - { label: "Rocket eBook on Wikipedia", url: "https://en.wikipedia.org/wiki/Rocket_eBook" }
    html: |
      <p>A Silicon Valley startup founded in 1997 that created the Rocket eBook, one of the first dedicated electronic book reading devices. The company built both the hardware device and the software ecosystem around it, including secure content distribution, desktop synchronization software, and the eBookNet.com portal.</p><p>NuvoMedia was acquired by Gemstar-TV Guide International in 2000. The company’s work laid important groundwork for the entire eBook industry that would later explode with the Kindle and iPad.</p>

  - slug: oebf
    title: Open eBook Forum (OeBF)
    category: org
    image: media/epub-logo.svg
    imageAlt: "EPUB logo — the standard that evolved from the Open eBook Forum’s work"
    links:
      - { label: "IDPF on Wikipedia", url: "https://en.wikipedia.org/wiki/International_Digital_Publishing_Forum" }
      - { label: "EPUB format", url: "https://en.wikipedia.org/wiki/EPUB" }
    html: |
      <p>An international, non-profit trade and standards organization with over 100 members, dedicated to promoting a thriving eBook market. Founded in 1999, the Forum created the Open eBook Publication Structure standard, which defined how eBook content should be structured.</p><p>This standard evolved through several iterations and ultimately became EPUB — now the dominant open format for eBooks, supported by virtually every e-reader except Amazon’s Kindle. The organization later became the International Digital Publishing Forum (IDPF), which merged into the W3C in 2017.</p>

  - slug: case
    title: CASE (Computer Aided Software Engineering)
    category: concept
    image: media/case-tool.png
    imageAlt: "A CASE tool showing UML diagrams — the type of software the CDIF standard interconnected"
    links:
      - { label: "CASE on Wikipedia", url: "https://en.wikipedia.org/wiki/Computer-aided_software_engineering" }
    html: |
      <p>A category of software tools popular in the late 1980s and early 1990s that aimed to automate and systematize the software development process. CASE tools provided graphical editors for designing databases, data flows, entity-relationship models, and object models, and could often generate code from these designs.</p><p>The CASE movement was a precursor to modern IDE features, UML tools, and low-code platforms. While the specific term fell out of fashion, the ideas behind CASE — visual modeling, code generation, and structured development methodologies — remain central to software engineering.</p>

  - slug: cdif
    title: CDIF (CASE Data Interchange Format)
    category: concept
    image: media/case-tool.png
    imageAlt: "A CASE tool — CDIF standardized data interchange between tools like this"
    links:
      - { label: "CDIF on Wikipedia", url: "https://en.wikipedia.org/wiki/CASE_Data_Interchange_Format" }
    html: |
      <p>An ANSI/EIA standard (EIA-927) that defined a common format for exchanging data between different CASE tools. The challenge was that in the late 1980s, organizations often used multiple CASE tools, but each stored its models in proprietary formats — making it impossible to share work between tools.</p><p>The CDIF standard included a comprehensive entity-relationship data model of software engineering processes with over 700 entities and relationships, published as a two-volume specification. David chaired this committee, which had approximately 30 voting members from major CASE industry companies and a 500+ person mailing list.</p>

  - slug: smalltalk
    title: Smalltalk
    category: tech
    image: media/smalltalk-76.png
    imageAlt: "Smalltalk-76 running on a Xerox Alto — the environment where OOP was born"
    links:
      - { label: "Smalltalk on Wikipedia", url: "https://en.wikipedia.org/wiki/Smalltalk" }
    html: |
      <p>A pioneering object-oriented programming language created at Xerox PARC in the 1970s by Alan Kay, Dan Ingalls, and Adele Goldberg. Smalltalk introduced or popularized many concepts that are now fundamental to software development: message-passing objects, the Model-View-Controller (MVC) pattern, integrated development environments (IDEs), and live coding with immediate feedback.</p><p>Its influence is enormous — Java, Ruby, Python, Objective-C, and Swift all owe significant design debts to Smalltalk. In the late 1980s and 1990s, Smalltalk was the language of choice for cutting-edge commercial software development, especially in finance and CASE tools.</p>

  - slug: gemstone
    title: GemStone
    category: tech
    image: media/gemstone.png
    imageAlt: "GemStone/S object database logo"
    links:
      - { label: "GemStone on Wikipedia", url: "https://en.wikipedia.org/wiki/GemStone/S" }
    html: |
      <p>An object database management system that allows Smalltalk (and later other language) objects to be stored, queried, and retrieved directly without the “impedance mismatch” of mapping objects to relational database tables.</p><p>GemStone was notable for supporting transparent persistence — objects could be saved and retrieved without explicit serialization code. At LongView International, David used GemStone to build the persistence layer for their derivatives trading system, a natural fit given the complex object models that financial software requires.</p>

  - slug: os2
    title: OS/2
    category: tech
    image: media/os2warp-logo.png
    imageAlt: "OS/2 Warp Version 3 logo"
    links:
      - { label: "OS/2 on Wikipedia", url: "https://en.wikipedia.org/wiki/OS/2" }
    html: |
      <p>An operating system co-developed by IBM and Microsoft in the late 1980s, intended as the successor to DOS. OS/2 featured preemptive multitasking, virtual memory, and a graphical user interface called Presentation Manager. For a time, it was considered the future of PC operating systems.</p><p>Though technically sophisticated, it lost the market battle to Windows 3.x and later Windows 95, primarily due to Microsoft’s pivot away from the partnership. OS/2 found a lasting niche in banking (many ATMs ran OS/2 well into the 2000s) and enterprise environments that valued its stability.</p>

  - slug: sgml
    title: SGML (Standard Generalized Markup Language)
    category: tech
    image: null
    links:
      - { label: "SGML on Wikipedia", url: "https://en.wikipedia.org/wiki/Standard_Generalized_Markup_Language" }
    html: |
      <p>An international standard (ISO 8879, published 1986) for defining markup languages. SGML is the parent metalanguage from which both HTML and XML descend. It provided a rigorous framework for describing document structures using tags and schemas.</p><p>SGML was widely used in large-scale publishing, government documentation (especially the U.S. Department of Defense), and the aerospace industry. Its power came with complexity, which eventually led to the creation of XML — a simpler, more web-friendly subset — in 1998. Pragmatica’s programming language used SGML syntax before XML even existed.</p>

  - slug: xml
    title: XML (Extensible Markup Language)
    category: tech
    image: null
    links:
      - { label: "XML on Wikipedia", url: "https://en.wikipedia.org/wiki/XML" }
    html: |
      <p>A simplified subset of SGML that became one of the foundational technologies of the modern web. Published as a W3C recommendation in 1998, XML provides a flexible, human-readable format for structured data that is both machine-parsable and self-describing.</p><p>XML is used in web services (SOAP, REST), configuration files, document formats (including Office Open XML and EPUB), data interchange, and countless other applications. It remains ubiquitous even as JSON has become the preferred format for many web APIs.</p>

  - slug: drm
    title: Digital Rights Management (DRM)
    category: concept
    image: null
    links:
      - { label: "DRM on Wikipedia", url: "https://en.wikipedia.org/wiki/Digital_rights_management" }
    html: |
      <p>Technologies that control how digital content — books, music, video, software — can be accessed, copied, and distributed after purchase. DRM systems typically use encryption and licensing servers to enforce restrictions set by content publishers.</p><p>The eBook industry was an early and prominent arena for DRM development and debate. At NuvoMedia and the Open eBook Forum, David worked on both the technical implementation of DRM for the Rocket eBook’s secure distribution system and the broader frameworks and ontology for digital rights management in electronic publishing.</p>

  - slug: ansi
    title: ANSI (American National Standards Institute)
    category: org
    image: null
    links:
      - { label: "ANSI on Wikipedia", url: "https://en.wikipedia.org/wiki/American_National_Standards_Institute" }
    html: |
      <p>The primary organization that coordinates voluntary consensus standards development in the United States. Founded in 1918, ANSI oversees the creation of norms and guidelines across virtually all industries and represents U.S. interests in international standards bodies like ISO and IEC.</p><p>ANSI doesn’t write standards itself but accredits standards-developing organizations and ensures their processes follow principles of openness, balance, consensus, and due process. The CDIF committee David chaired operated under ANSI/EIA rules.</p>

  - slug: eia
    title: EIA (Electronic Industries Alliance)
    category: org
    image: null
    links:
      - { label: "EIA on Wikipedia", url: "https://en.wikipedia.org/wiki/Electronic_Industries_Alliance" }
    html: |
      <p>A trade organization that developed technical standards for the electronics industry. Active from 1924 to 2011, the EIA created widely-used standards including the RS-232 serial communication standard, the 19-inch server rack specification, and the color codes for electronic resistors.</p><p>The CDIF standards committee operated under the EIA’s standards-development umbrella, giving it the formal ANSI/EIA designation that ensured the process met national standards for openness and consensus.</p>

  - slug: lan
    title: LAN (Local Area Network)
    category: concept
    image: null
    links:
      - { label: "LAN on Wikipedia", url: "https://en.wikipedia.org/wiki/Local_area_network" }
    html: |
      <p>A computer network that connects devices within a limited area like a building or campus. Today, LANs are invisible infrastructure that we take for granted, but in the 1980s, building one was a significant technical undertaking requiring specialized knowledge of cabling, protocols, and network operating systems.</p><p>David describes proposing and building a 20-station LAN at Sage Software that eventually grew to span 7 states and 2 countries — a trajectory that mirrors the industry’s evolution from local networking to wide-area and eventually internet connectivity.</p>

  - slug: visualworks
    title: VisualWorks
    category: tech
    image: media/visualworks.png
    imageAlt: "VisualWorks Smalltalk development environment"
    links:
      - { label: "VisualWorks on Wikipedia", url: "https://en.wikipedia.org/wiki/VisualWorks" }
    html: |
      <p>A commercial Smalltalk development environment originally created at Xerox PARC as part of the Smalltalk-80 system. It was commercialized by ParcPlace Systems and later acquired by Cincom, becoming one of the premier Smalltalk environments for enterprise software development.</p><p>VisualWorks was known for its mature class libraries, cross-platform GUI framework, and sophisticated development tools including a browser, debugger, and refactoring support. At LongView International, it was the platform of choice for building their derivatives trading systems.</p>

  - slug: entity-relationship
    title: Entity-Relationship Modeling
    category: concept
    image: media/er-diagram.png
    imageAlt: "An entity-relationship diagram showing entities, attributes, and relationships"
    links:
      - { label: "ER Model on Wikipedia", url: "https://en.wikipedia.org/wiki/Entity%E2%80%93relationship_model" }
    html: |
      <p>A data modeling technique invented by Peter Chen in 1976, used to describe the structure of data in terms of entities (things), attributes (properties of things), and relationships between entities. ER models are typically represented as diagrams and are fundamental to relational database design.</p><p>David has deep experience with ER modeling: he built ER diagramming tools in Smalltalk, created an ER model compiler that could generate production-grade relational database schemas, and the CDIF standard he chaired included a 700+ entity ER model of software engineering processes.</p>

  - slug: object-oriented
    title: Object-Oriented Programming (OOP)
    category: concept
    image: null
    links:
      - { label: "OOP on Wikipedia", url: "https://en.wikipedia.org/wiki/Object-oriented_programming" }
    html: |
      <p>A programming paradigm that organizes software around “objects” — bundles of data and the methods that operate on that data — rather than around functions and logic. Key concepts include encapsulation, inheritance, polymorphism, and message passing.</p><p>OOP became the dominant programming paradigm in the 1990s and underpins most modern languages including Java, C#, Python, and Swift. David was an early adopter and evangelist, working extensively with Smalltalk (the language that pioneered OOP) and later mentoring organizations in object-oriented design using design patterns.</p>

  - slug: design-patterns
    title: Design Patterns
    category: concept
    image: null
    links:
      - { label: "Software Design Patterns", url: "https://en.wikipedia.org/wiki/Software_design_pattern" }
      - { label: "Design Patterns (book)", url: "https://en.wikipedia.org/wiki/Design_Patterns" }
    html: |
      <p>Reusable solutions to commonly occurring problems in software design, popularized by the influential 1994 book <em>Design Patterns: Elements of Reusable Object-Oriented Software</em> by Gamma, Helm, Johnson, and Vlissides (known as the “Gang of Four”).</p><p>Patterns like Observer, Factory, Strategy, and Model-View-Controller provide a shared vocabulary for developers and proven architectural approaches. David was an early adopter and evangelist for design patterns in software development, using pattern-based mentoring to help organizations improve their object-oriented practices.</p>

  - slug: derivatives-trading
    title: Derivatives Trading
    category: concept
    image: null
    links:
      - { label: "Derivatives on Wikipedia", url: "https://en.wikipedia.org/wiki/Derivative_(finance)" }
    html: |
      <p>The buying and selling of financial contracts (derivatives) whose value is derived from underlying assets like stocks, bonds, currencies, or commodities. Common derivatives include options, futures, swaps, and complex structured products.</p><p>Building trading systems for derivatives is one of the most technically demanding areas of software engineering, requiring complex mathematical models, real-time data processing, and extreme reliability. The framework-based approach David helped build at LongView International used Smalltalk to model the inherently object-oriented nature of financial instruments.</p>

  - slug: trustworthy-computing
    title: Trustworthy Computing
    category: concept
    image: null
    links:
      - { label: "Trustworthy Computing on Wikipedia", url: "https://en.wikipedia.org/wiki/Trustworthy_computing" }
    html: |
      <p>Trustworthy Computing (TwC) was the Microsoft-wide initiative launched by Bill Gates in his famous January 2002 memo, which declared security the company’s highest priority. TwC became a formal organization within the company responsible for driving security, privacy, and reliability practices across every product group.</p><p>David served as Chief of Staff to the Corporate Vice President of Trustworthy Computing, where he operated at the intersection of executive strategy, cross-team coordination, and technical execution — helping drive security transformation across Microsoft’s engineering culture during a critical period in the company’s history.</p>

  - slug: consent-decree
    title: Consent Decree (Microsoft)
    category: concept
    image: null
    links:
      - { label: "US v. Microsoft on Wikipedia", url: "https://en.wikipedia.org/wiki/United_States_v._Microsoft_Corp." }
    html: |
      <p>The 2001 settlement of <em>United States v. Microsoft Corporation</em>, one of the most significant antitrust cases in technology history. After being found to have illegally maintained its monopoly in PC operating systems, Microsoft agreed to a set of remedies overseen by a Technical Committee.</p><p>The decree required Microsoft to share its APIs with third-party companies, document its protocols, and establish compliance monitoring. David led the engineering compliance programs that implemented Microsoft’s technical obligations under this decree, including tools like APIscan for verifying API accessibility.</p>

  - slug: checkpoint-express
    title: CheckPoint Express
    category: project
    image: null
    links: []
    html: |
      <p>An internal Microsoft engineering compliance tool that was part of the mandatory policy enforcement system. It tracked and verified that software development teams followed Microsoft’s required engineering policies covering security, privacy, accessibility, legal compliance, and other requirements throughout the software development lifecycle.</p><p>As Director of Compliance Engineering, David oversaw CheckPoint Express as part of a broader compliance program with a budget exceeding $10M annually.</p>

  - slug: apiscan
    title: APIscan
    category: project
    image: null
    links: []
    html: |
      <p>A compliance analysis tool David managed at Microsoft as part of the Consent Decree middleware compliance program. APIscan analyzed Microsoft’s software to verify proper API documentation and accessibility as required by the terms of the antitrust settlement.</p><p>The tool was part of a broader regulatory engagement effort ensuring that Microsoft’s products met the technical obligations imposed by the court, particularly around making interfaces available to third-party software developers.</p>

  - slug: sinclair
    title: Sinclair Research
    category: org
    image: media/sinclair-zx80.jpg
    imageAlt: "The Sinclair ZX80 — one of the first affordable home computers"
    links:
      - { label: "Sinclair Research on Wikipedia", url: "https://en.wikipedia.org/wiki/Sinclair_Research" }
      - { label: "ZX Spectrum on Wikipedia", url: "https://en.wikipedia.org/wiki/ZX_Spectrum" }
    html: |
      <p>A British consumer electronics company founded by Sir Clive Sinclair that produced some of the earliest affordable home computers, including the ZX80 (1980), ZX81 (1981), and ZX Spectrum (1982). These machines brought personal computing to millions of people at price points under $200.</p><p>Sinclair played a pivotal role in the personal computing revolution, especially in the UK and Europe, spawning an entire generation of programmers. David was one of the earliest employees at Sinclair’s US operation (Sinclair Research Ltd. in Boston), starting part-time in 1979 before the ZX80 had even launched.</p>

  - slug: zx80
    title: Sinclair ZX-80
    category: tech
    image: media/zx80.jpg
    imageAlt: "The Sinclair ZX-80 home computer"
    links:
      - { label: "ZX80 on Wikipedia", url: "https://en.wikipedia.org/wiki/ZX80" }
    html: |
      <p>One of the first affordable home computers, manufactured by Sinclair Research and launched in 1980 at a price of £99.95 in the UK ($199.95 in the US). It featured a Zilog Z80 processor running at 3.25 MHz, 1KB of RAM, and output to a standard television set.</p><p>Despite its limitations — the display would flicker during computation and the membrane keyboard was famously difficult to use — the ZX80 introduced hundreds of thousands of people to computing and kickstarted the home computer revolution. David managed technical support for ZX-80 users at Sinclair’s US office.</p>

  - slug: timex-sinclair
    title: Timex/Sinclair 2000
    category: tech
    image: media/timex-sinclair-1000-top.jpg
    imageAlt: "The Timex Sinclair 1000 — the US version of the Sinclair ZX81"
    links:
      - { label: "Timex Sinclair on Wikipedia", url: "https://en.wikipedia.org/wiki/Timex_Sinclair" }
    html: |
      <p>A home computer developed by Timex Computer Corporation as a successor to the Timex/Sinclair 1000 (the US version of the Sinclair ZX81). Timex had partnered with Sinclair Research to manufacture and sell Sinclair’s computers in the US market.</p><p>David worked on the TS2000’s hardware and software design at Timex Computer Corp., including inventing a memory bank-switching mechanism and designing a semi-custom chip to implement it. He also authored the complete third-party developer technical manual. Timex Computer Corp. folded in late 1983 amid the home computer market shakeout.</p>

  - slug: bank-switching
    title: Bank Switching
    category: concept
    image: null
    links:
      - { label: "Bank switching on Wikipedia", url: "https://en.wikipedia.org/wiki/Bank_switching" }
    html: |
      <p>A technique for expanding the usable memory of early computers beyond their native addressing limits. Processors like the Z80 could only directly address 64KB of memory, but by rapidly swapping different “banks” of memory chips into the processor’s address space, systems could access much more.</p><p>David invented a bank switching mechanism for the Timex/Sinclair 2000 and designed a semi-custom chip to implement it. He was awarded a patent for this invention — his first patent, and one that addressed a fundamental hardware constraint of the era.</p>

  - slug: multimate
    title: MultiMate
    category: org
    image: null
    imageAlt: "MultiMate word processor running on an IBM PC"
    links:
      - { label: "MultiMate on Wikipedia", url: "https://en.wikipedia.org/wiki/MultiMate" }
    html: |
      <p>A popular word processing program for IBM PCs in the 1980s that emulated the keyboard interface of Wang dedicated word processors. This was a shrewd design choice — secretaries and office workers already trained on Wang systems could switch to a PC without relearning their workflow.</p><p>MultiMate was one of the leading word processors of its era, before being overtaken by WordPerfect and later Microsoft Word. The company was acquired by Ashton-Tate in December 1985. David managed the OEM/International group, porting the product to platforms including the Zenith Z-100 for a US Air Force contract.</p>

  - slug: pragmatica
    title: Pragmatica, Inc.
    category: org
    image: null
    links: []
    html: |
      <p>A startup David founded in 1995 that developed advanced Internet publishing tools. Its core product was an object-oriented web programming language with SGML syntax — a concept that predated XML (which wouldn’t be published until 1998).</p><p>David developed the business plan, recruited the executive team, secured multiple rounds of angel investment, and wrote substantial portions of the ~100,000-line C++ codebase. The company grew to 10 employees, several consultants, and over 5,000 users before David left to join NuvoMedia in 1998.</p>

  - slug: ebooknet
    title: eBookNet.com
    category: project
    image: null
    links: []
    html: |
      <p>Described at its launch as the world’s largest eBook portal, eBookNet.com was developed by a cross-organization team of 12 people that David led at NuvoMedia. The site served as a central hub for discovering, purchasing, and downloading electronic books.</p><p>David designed both the user interface and the architecture for the site. In the late 1990s, building a large-scale content portal like this was a significant undertaking, and eBookNet.com represented one of the earliest attempts to create a comprehensive marketplace for digital books.</p>

  - slug: oeb-pub-structure
    title: Open eBook Publication Structure
    category: concept
    image: media/epub-logo.svg
    imageAlt: "EPUB logo — the Open eBook Publication Structure evolved into the EPUB standard"
    links:
      - { label: "EPUB on Wikipedia", url: "https://en.wikipedia.org/wiki/EPUB" }
      - { label: "OEBPS", url: "https://en.wikipedia.org/wiki/Open_eBook" }
    html: |
      <p>A standard defining how electronic book content should be structured and formatted, first drafted by David and others at NuvoMedia. It specified an XML-based format for representing eBook content, including text, images, metadata, and navigation.</p><p>This standard evolved through the Open eBook Forum into the OEBPS (Open eBook Publication Structure) format and ultimately became EPUB — now the dominant open standard for eBooks, used by Apple Books, Google Play Books, Kobo, and virtually every e-reader except Amazon’s Kindle.</p>

  - slug: public-key-crypto
    title: Public Key Cryptography
    category: concept
    image: null
    links:
      - { label: "Public-key cryptography", url: "https://en.wikipedia.org/wiki/Public-key_cryptography" }
    html: |
      <p>A cryptographic system that uses pairs of mathematically related keys: a public key (shared freely) and a private key (kept secret). Data encrypted with one key can only be decrypted with the other, enabling secure communication between parties who have never met.</p><p>Public key cryptography enables digital signatures, secure key exchange, and forms the backbone of internet security (HTTPS/TLS). It was central to the DRM and secure distribution systems David worked on in the eBook space, where content needed to be encrypted for authorized readers only.</p>

  - slug: molecular-gastronomy
    title: Molecular Gastronomy
    category: concept
    image: media/spherification.jpg
    imageAlt: "Spherification — a signature molecular gastronomy technique"
    links:
      - { label: "Molecular gastronomy", url: "https://en.wikipedia.org/wiki/Molecular_gastronomy" }
    html: |
      <p>A subdiscipline of food science that explores the physical and chemical transformations that occur during cooking. Coined by Hungarian physicist Nicholas Kurti and French chemist Hervé This in 1988, it bridges the gap between kitchen tradition and laboratory science.</p><p>Techniques include spherification (creating caviar-like spheres from liquids using sodium alginate), sous vide (precision temperature-controlled cooking), foams, gels, and the use of hydrocolloids and emulsifiers to achieve novel textures and presentations. Chefs like Ferran Adrià (elBulli) and Heston Blumenthal (The Fat Duck) popularized these techniques in fine dining.</p>

  - slug: angel-investment
    title: Angel Investment
    category: concept
    image: null
    links:
      - { label: "Angel investor on Wikipedia", url: "https://en.wikipedia.org/wiki/Angel_investor" }
    html: |
      <p>Early-stage funding provided by individual investors (called “angel investors”) to startups, typically in exchange for equity. Angel investment fills the gap between personal savings / friends-and-family money and larger venture capital rounds.</p><p>Angels typically invest their own money (as opposed to institutional funds), often bring industry expertise and connections, and are willing to take on more risk than traditional investors. David secured multiple rounds of angel investment to fund Pragmatica, growing the company to 10 employees and over 5,000 users.</p>

  - slug: excelerator
    title: Excelerator II
    category: project
    image: null
    links: []
    html: |
      <p>A CASE (Computer Aided Software Engineering) tool developed by INTERSOLV (formerly Sage Software) for the OS/2 operating system. Excelerator II provided graphical tools for software design, data modeling, and code generation, along with a LAN-hosted repository for storing and sharing design artifacts.</p><p>David served as both Director of Development and Chief Architect for Excelerator II, managing a bi-coastal team of 12 people while also doing significant design and coding work himself. The product was part of INTERSOLV’s larger suite of software development tools.</p>

  - slug: rom-cartridges
    title: ROM Cartridges
    category: concept
    image: null
    links:
      - { label: "ROM cartridge on Wikipedia", url: "https://en.wikipedia.org/wiki/ROM_cartridge" }
    html: |
      <p>Read-Only Memory modules that contain software stored permanently on a chip, requiring no disk drive or other storage device. In the early personal computing era, ROM cartridges provided a way to distribute software that loaded instantly and couldn’t be accidentally erased.</p><p>At MultiMate, David ported the word processor to run from ROM cartridges on the HP Portable Plus — a significant technical challenge that required making a large program work with dynamically-located data segments while running from read-only storage, without disrupting the system’s overall architecture.</p>

  - slug: csharp
    title: C# (C Sharp)
    category: tech
    image: null
    links:
      - { label: "C# on Wikipedia", url: "https://en.wikipedia.org/wiki/C_Sharp_(programming_language)" }
    html: |
      <p>A modern, object-oriented programming language developed by Microsoft, first released in 2000 as part of the .NET initiative. Designed by Anders Hejlsberg (who also created Turbo Pascal and Delphi), C# drew heavily from C++, Java, and Smalltalk.</p><p>C# has become one of the most popular programming languages in the world, used for everything from Windows desktop applications and web services to game development (via Unity) and mobile apps (via Xamarin/MAUI). David used C# extensively at Microsoft, including to build FlexWiki.</p>

  - slug: z80
    title: Zilog Z80
    category: tech
    image: media/z80-chip.jpg
    imageAlt: "A Zilog Z80 microprocessor chip"
    links:
      - { label: "Z80 on Wikipedia", url: "https://en.wikipedia.org/wiki/Zilog_Z80" }
    html: |
      <p>An 8-bit microprocessor designed by Zilog and released in 1976. It became one of the most widely used CPUs in computing history, powering machines like the Sinclair ZX80/ZX81/ZX Spectrum, TRS-80, MSX computers, and the original Game Boy.</p><p>The Z80 was software-compatible with the Intel 8080 but added many improvements, including a simpler power supply, more registers, and additional instructions. David worked extensively with Z80 hardware and software at Sinclair Research, Heuristics, and Timex Computer Corp.</p>

  - slug: x86
    title: x86 Architecture
    category: tech
    image: null
    links:
      - { label: "x86 on Wikipedia", url: "https://en.wikipedia.org/wiki/X86" }
    html: |
      <p>A family of instruction set architectures based on the Intel 8086 processor (1978) that became the dominant standard for personal computers. The lineage runs from 8086 → 80286 → 80386 → 80486 → Pentium and continues through today’s Intel and AMD processors.</p><p>David worked extensively with x86 assembly language and protected-mode programming on 286 and 386 processors, building low-level system tools like CRTS (over 100,000 lines of C and x86 assembler) at Sage Software, as well as DOS Dynamic Link Libraries and mixed-language integration.</p>

  - slug: dotnet
    title: .NET Framework
    category: tech
    image: null
    links:
      - { label: ".NET Framework on Wikipedia", url: "https://en.wikipedia.org/wiki/.NET_Framework" }
    html: |
      <p>A software framework developed by Microsoft, first released in 2002, providing a managed runtime environment (the CLR), a large class library, and support for multiple programming languages including C#, VB.NET, and F#. It became the primary platform for building Windows applications, web services, and enterprise software.</p><p>.NET has since evolved into the cross-platform, open-source .NET (formerly .NET Core), which runs on Windows, macOS, and Linux. David used the .NET Framework extensively at Microsoft, most notably to build FlexWiki in C#.</p>

  - slug: aspnet
    title: ASP.NET
    category: tech
    image: null
    links:
      - { label: "ASP.NET on Wikipedia", url: "https://en.wikipedia.org/wiki/ASP.NET" }
    html: |
      <p>Microsoft’s server-side web application framework built on the .NET platform. It enables developers to build dynamic websites, web applications, and web APIs. Introduced in 2002 as a successor to Active Server Pages (classic ASP), it represented a major leap in web development productivity.</p><p>ASP.NET went through several major evolutions: Web Forms (component-based, event-driven), MVC (model-view-controller pattern), Web API (RESTful services), and the modern cross-platform ASP.NET Core. It remains one of the most popular frameworks for building server-side web applications.</p>

  - slug: sharepoint
    title: SharePoint
    category: tech
    image: null
    links:
      - { label: "SharePoint on Wikipedia", url: "https://en.wikipedia.org/wiki/SharePoint" }
    html: |
      <p>A web-based collaboration platform developed by Microsoft, used for document management, intranet portals, content management, and team collaboration. First released in 2001, it quickly became one of Microsoft’s fastest-growing enterprise products.</p><p>SharePoint provides features like document libraries with version control, team sites, search, workflows, and integration with Office applications. It’s now a core part of the Microsoft 365 ecosystem, with both on-premises and cloud-hosted (SharePoint Online) versions used by hundreds of thousands of organizations worldwide.</p>

